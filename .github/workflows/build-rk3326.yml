name: RK3326 U-Boot Build

"on":
  workflow_dispatch:

jobs:
  build:
    name: Build RK3326 U-Boot
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04

    steps:

      # ==========================================================
      # 1. 显示基础环境
      # ==========================================================

      - name: Show environment
        run: |
          echo "=========================================="
          echo "RK3326 U-Boot Build"
          echo "=========================================="

          echo
          echo "Ubuntu:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

      # ==========================================================
      # 2. 安装编译环境
      # ==========================================================

      - name: Install build dependencies
        run: |
          echo "=========================================="
          echo "Install build dependencies"
          echo "=========================================="

          DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            device-tree-compiler \
            swig \
            python3 \
            python3-dev \
            python3-pip \
            pkg-config \
            cpio \
            file \
            wget \
            curl \
            git \
            ca-certificates \
            xz-utils \
            gzip \
            bzip2 \
            unzip \
            rsync \
            openssl

          echo "Python:"
          which python3
          python3 --version
      # ==========================================================
      # 3. 安装 AArch64 工具链
      # ==========================================================

      - name: Install AArch64 toolchain
        run: |
          echo "=========================================="
          echo "Install AArch64 toolchain"
          echo "=========================================="

          apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          echo
          echo "Compiler:"
          which aarch64-linux-gnu-gcc

          aarch64-linux-gnu-gcc --version

          echo
          echo "Binutils:"
          aarch64-linux-gnu-ld --version | head -1
        
      # ==========================================================
      # 4. 获取官方源码
      # ==========================================================

      - name: Clone official source
        run: |
          echo "=========================================="
          echo "Clone official Rockchip source"
          echo "=========================================="

          git clone https://github.com/rockchip-linux/u-boot.git
          git clone https://github.com/rockchip-linux/rkbin.git

          echo
          echo "u-boot:"
          ls -lah u-boot

          echo
          echo "rkbin:"
          ls -lah rkbin

      # ==========================================================
      # 5. 检查 U-Boot
      # ==========================================================

      - name: Check U-Boot source
        run: |
          echo "=========================================="
          echo "U-Boot source"
          echo "=========================================="

          ls -lh u-boot

          echo
          echo "U-Boot version:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL) =' \
            u-boot/Makefile \
            || true

      # ==========================================================
      # 6. RK3326 defconfig
      # ==========================================================

      - name: Make RK3326 defconfig
        working-directory: u-boot
        run: |
          echo "=========================================="
          echo "make RK3326 defconfig"
          echo "=========================================="

          make distclean

          cp ../rkbin/bin/rk33/rk3326_bl31_v1.34.elf ./bl31.elf

          make rk3326_defconfig

          echo "rk3326_defconfig" > ../rk_defconfig.txt

      # ==========================================================
      # 7. 编译 U-Boot
      # ==========================================================
      - name: Build U-Boot
        working-directory: u-boot
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |       
          echo "=========================================="
          echo "Build RK3326 U-Boot"
          echo "=========================================="

          echo
          echo "CPU cores:"
          nproc

          echo
          echo "Build:"

          make \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            -j"$(nproc)"

      # ==========================================================
      # 8. 编译 u-boot.itb
      # ==========================================================

      - name: Build u-boot.itb
        working-directory: u-boot
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          echo "=========================================="
          echo "Build u-boot.itb"
          echo "=========================================="

          make \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            u-boot.itb

          echo
          echo "u-boot.itb:"
          ls -lh u-boot.itb

      # ==========================================================
      # 9. 检查 TPL / SPL
      # ==========================================================

      - name: Check TPL and SPL
        working-directory: u-boot
        run: |
          echo "=========================================="
          echo "Check TPL / SPL"
          echo "=========================================="

          echo
          echo "TPL:"
          ls -lh tpl/u-boot-tpl.bin

          echo
          echo "SPL:"
          ls -lh spl/u-boot-spl.bin

      # ==========================================================
      # 10. 检查 mkimage
      # ==========================================================

      - name: Check mkimage
        working-directory: u-boot
        run: |
          echo "=========================================="
          echo "Check mkimage"
          echo "=========================================="

          if [ ! -x tools/mkimage ]; then
            echo "ERROR: tools/mkimage not found."
            exit 1
          fi

          ls -lh tools/mkimage

      # ==========================================================
      # 11. 生成 idbloader.img
      # ==========================================================

      - name: Build idbloader.img
        working-directory: u-boot
        run: |
          echo "=========================================="
          echo "Build idbloader.img"
          echo "=========================================="

          rm -f idbloader.img

          ./tools/mkimage \
            -n rk3326 \
            -T rksd \
            -d tpl/u-boot-tpl.bin \
            idbloader.img

          cat spl/u-boot-spl.bin >> idbloader.img

          echo
          echo "=========================================="
          echo "idbloader.img created"
          echo "=========================================="

          ls -lh idbloader.img

          echo
          echo "File:"
          file idbloader.img

          echo
          echo "SHA256:"
          sha256sum idbloader.img

      # ==========================================================
      # 12. 创建 Artifact 目录
      # ==========================================================

      - name: Prepare build output
        if: always()
        run: |
          mkdir -p build-output/u-boot
          mkdir -p build-output/idbloader
          mkdir -p build-output/config

      # ==========================================================
      # 13. 收集 U-Boot 编译结果
      # ==========================================================

      - name: Collect U-Boot output
        if: always()
        run: |
          cp u-boot/u-boot.itb build-output/u-boot/ 2>/dev/null || true
          cp u-boot/u-boot.bin build-output/u-boot/ 2>/dev/null || true
          cp u-boot/u-boot-nodtb.bin build-output/u-boot/ 2>/dev/null || true
          cp u-boot/u-boot-dtb.bin build-output/u-boot/ 2>/dev/null || true
          cp u-boot/u-boot.dtb build-output/u-boot/ 2>/dev/null || true
          cp u-boot/spl/u-boot-spl.bin build-output/u-boot/ 2>/dev/null || true
          cp u-boot/tpl/u-boot-tpl.bin build-output/u-boot/ 2>/dev/null || true

      # ==========================================================
      # 14. 收集 idbloader
      # ==========================================================

      - name: Collect idbloader
        if: always()
        run: |
          cp u-boot/idbloader.img build-output/idbloader/ 2>/dev/null || true

      # ==========================================================
      # 15. 收集配置
      # ==========================================================

      - name: Collect configuration
        if: always()
        run: |
          cp u-boot/.config build-output/config/u-boot.config 2>/dev/null || true
          cp rk_defconfig.txt build-output/config/ 2>/dev/null || true

      # ==========================================================
      # 16. 生成 Build 信息
      # ==========================================================

      - name: Generate build information
        if: always()
        run: |
          {
            echo "=========================================="
            echo "RK3326 U-Boot Build"
            echo "=========================================="
            echo
            echo "Build date:"
            date
            echo
            echo "U-Boot source:"
            echo "https://github.com/rockchip-linux/u-boot"
            echo
            echo "rkbin source:"
            echo "https://github.com/rockchip-linux/rkbin"
            echo
            echo "U-Boot commit:"
            cd u-boot
            git rev-parse HEAD
            echo
            echo "Compiler:"
            aarch64-linux-gnu-gcc --version | head -1
            echo
            echo "Architecture:"
            echo "U-Boot default"
          } > build-output/build-info.txt

      # ==========================================================
      # 17. 生成 SHA256
      # ==========================================================

      - name: Generate SHA256
        if: always()
        run: |
          cd build-output

          find . -type f ! -name SHA256SUMS -print0 | \
            sort -z | \
            xargs -0 sha256sum > SHA256SUMS

          echo "=========================================="
          echo "SHA256SUMS"
          echo "=========================================="

          cat SHA256SUMS

      # ==========================================================
      # 18. 显示最终成果
      # ==========================================================

      - name: Show build output
        if: always()
        run: |
          echo "=========================================="
          echo "FINAL BUILD OUTPUT"
          echo "=========================================="

          find build-output -type f -exec ls -lh {} \;

      # ==========================================================
      # 19. 上传 Artifact
      # ==========================================================

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3326-uboot-${{ github.sha }}
          path: build-output/
          if-no-files-found: warn
          retention-days: 30