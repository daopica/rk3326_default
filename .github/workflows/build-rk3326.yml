```yaml
name: RK3326 U-Boot Build

on:
  workflow_dispatch:

jobs:
  build:

    name: Build RK3326 U-Boot on Ubuntu 18.04

    runs-on: ubuntu-22.04

    container:
      image: ubuntu:18.04

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Fix Ubuntu 18.04 repositories
      # ==========================================================

      - name: Fix Ubuntu 18.04 repositories
        run: |
          sed -i \
            -e 's|http://archive.ubuntu.com/ubuntu/|http://old-releases.ubuntu.com/ubuntu/|g' \
            -e 's|http://security.ubuntu.com/ubuntu/|http://old-releases.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list

          cat /etc/apt/sources.list

          apt-get update


      # ==========================================================
      # 3. Install build dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            device-tree-compiler \
            python \
            python-dev \
            swig \
            pkg-config \
            cpio \
            file \
            wget \
            curl \
            git \
            ca-certificates \
            xz-utils \
            gzip \
            bzip2 \
            unzip


      # ==========================================================
      # 4. Install AArch64 cross compiler
      # ==========================================================

      - name: Install AArch64 toolchain
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          echo "GCC:"
          aarch64-linux-gnu-gcc --version

          echo
          echo "GCC location:"
          which aarch64-linux-gnu-gcc


      # ==========================================================
      # 5. Show environment
      # ==========================================================

      - name: Show build environment
        run: |
          echo "=========================================="
          echo "Ubuntu"
          echo "=========================================="

          cat /etc/os-release

          echo
          echo "=========================================="
          echo "Compiler"
          echo "=========================================="

          aarch64-linux-gnu-gcc --version

          echo
          echo "=========================================="
          echo "CPU"
          echo "=========================================="

          nproc

          echo
          echo "=========================================="
          echo "Memory"
          echo "=========================================="

          free -h

          echo
          echo "=========================================="
          echo "Repository"
          echo "=========================================="

          ls -lah

          echo
          echo "U-Boot:"
          ls -lah u-boot

          echo
          echo "rkbin:"
          ls -lah rkbin


      # ==========================================================
      # 6. Detect RK3326 configurations
      # ==========================================================

      - name: Find RK3326 defconfig
        working-directory: u-boot
        run: |
          echo "=========================================="
          echo "RK3326 defconfig"
          echo "=========================================="

          find configs \
            -maxdepth 1 \
            -type f \
            -iname '*rk3326*' \
            -print \
            | sort


      # ==========================================================
      # 7. Configure U-Boot
      # ==========================================================

      - name: Configure U-Boot
        working-directory: u-boot
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |

          echo "=========================================="
          echo "Configure RK3326"
          echo "=========================================="

          # ======================================================
          # IMPORTANT
          #
          # 把下面的 rk3326_defconfig 改成你实际的
          # RK3326 defconfig。
          # ======================================================

          make \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            rk3326_defconfig

          echo
          echo "Generated .config:"
          ls -lh .config


      # ==========================================================
      # 8. Enable useful debug options
      # ==========================================================

      - name: Enable debug options
        working-directory: u-boot
        run: |

          echo "=========================================="
          echo "Debug configuration"
          echo "=========================================="

          if [ -x ./scripts/config ]; then

            ./scripts/config --enable CONFIG_LOG
            ./scripts/config --set-val CONFIG_LOG_MAX_LEVEL 9

            ./scripts/config --enable CONFIG_CMD_MEMINFO
            ./scripts/config --enable CONFIG_CMD_MEMTEST

            ./scripts/config --enable CONFIG_CMD_MMC
            ./scripts/config --enable CONFIG_CMD_FAT
            ./scripts/config --enable CONFIG_CMD_EXT4

            ./scripts/config --enable CONFIG_CMD_USB

            ./scripts/config --enable CONFIG_CMD_NET
            ./scripts/config --enable CONFIG_CMD_PING

            ./scripts/config --enable CONFIG_CMD_ENV
            ./scripts/config --enable CONFIG_CMD_SAVEENV
            ./scripts/config --enable CONFIG_CMD_LOADENV

            ./scripts/config --enable CONFIG_CMD_GPIO
            ./scripts/config --enable CONFIG_CMD_I2C
            ./scripts/config --enable CONFIG_CMD_DM

            make olddefconfig

          else

            echo "scripts/config not found."
            echo "Skip debug configuration."

          fi


      # ==========================================================
      # 9. Save configuration
      # ==========================================================

      - name: Save configuration
        run: |
          mkdir -p build-output/config

          cp u-boot/.config \
            build-output/config/u-boot.config

          echo
          echo "Debug related configuration:"
          grep -E \
            'CONFIG_(DEBUG|LOG|CMD_MMC|CMD_USB|CMD_NET|CMD_ENV|CMD_SAVEENV|CMD_LOADENV)' \
            u-boot/.config \
            || true


      # ==========================================================
      # 10. Build U-Boot
      # ==========================================================

      - name: Build U-Boot
        working-directory: u-boot
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |

          echo "=========================================="
          echo "Building U-Boot"
          echo "=========================================="

          make \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            -j"$(nproc)" \
            2>&1 | tee ../build.log


      # ==========================================================
      # 11. Collect U-Boot binaries
      # ==========================================================

      - name: Collect U-Boot output
        run: |

          mkdir -p build-output/u-boot
          mkdir -p build-output/logs

          echo "Collecting binaries..."

          cp u-boot/u-boot.bin \
            build-output/u-boot/ \
            2>/dev/null || true

          cp u-boot/u-boot.itb \
            build-output/u-boot/ \
            2>/dev/null || true

          cp u-boot/u-boot-nodtb.bin \
            build-output/u-boot/ \
            2>/dev/null || true

          cp u-boot/u-boot-dtb.bin \
            build-output/u-boot/ \
            2>/dev/null || true

          cp u-boot/u-boot.dtb \
            build-output/u-boot/ \
            2>/dev/null || true

          cp u-boot/spl/u-boot-spl.bin \
            build-output/u-boot/ \
            2>/dev/null || true

          cp u-boot/tpl/u-boot-tpl.bin \
            build-output/u-boot/ \
            2>/dev/null || true

          cp build.log \
            build-output/logs/ \
            2>/dev/null || true


      # ==========================================================
      # 12. Copy rkbin
      # ==========================================================

      - name: Collect rkbin
        run: |

          if [ -d rkbin ]; then
            cp -a rkbin build-output/
          fi


      # ==========================================================
      # 13. Generate build information
      # ==========================================================

      - name: Generate build information
        run: |

          cat > build-output/build-info.txt <<EOF
          ==========================================
          RK3326 U-Boot Build
          ==========================================

          Date:
          $(date)

          Git commit:
          ${GITHUB_SHA}

          Git branch:
          ${GITHUB_REF_NAME}

          Ubuntu:
          $(cat /etc/os-release | grep PRETTY_NAME)

          Compiler:
          $(aarch64-linux-gnu-gcc --version | head -1)

          Architecture:
          arm64

          Cross compiler:
          aarch64-linux-gnu-

          ==========================================
          U-Boot Git
          ==========================================
          EOF

          cd u-boot

          git describe --tags --always --dirty \
            >> ../build-output/build-info.txt \
            2>/dev/null || true

          git rev-parse HEAD \
            >> ../build-output/build-info.txt \
            2>/dev/null || true


      # ==========================================================
      # 14. SHA256
      # ==========================================================

      - name: Generate SHA256
        run: |

          cd build-output

          find . \
            -type f \
            ! -name SHA256SUMS \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

          cat SHA256SUMS


      # ==========================================================
      # 15. Show final result
      # ==========================================================

      - name: Show build result
        if: always()
        run: |

          echo "=========================================="
          echo "FINAL OUTPUT"
          echo "=========================================="

          find build-output \
            -type f \
            -exec ls -lh {} \; \
            2>/dev/null || true

 
      # ==========================================================
      # 16. Upload Artifact
      # ==========================================================

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3326-uboot-build
          path: build-output/
          if-no-files-found: warn
          retention-days: 30
```
