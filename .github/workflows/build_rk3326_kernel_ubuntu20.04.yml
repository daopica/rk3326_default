name: RK3326_kernel_build_ubuntu20.04

"on":
  workflow_dispatch:

jobs:
  build:
    name: RK3326 Kernel Build Ubuntu20.04
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:

      # ============================================================
      # 环境信息
      # ============================================================

      - name: Show environment
        run: |
          echo "=========================================="
          echo "RK3326 Kernel Build"
          echo "=========================================="

          cat /etc/os-release

          echo
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"


      # ============================================================
      # 安装编译环境
      # ============================================================

      - name: Install build dependencies
        run: |
          echo "=========================================="
          echo "Install build dependencies"
          echo "=========================================="

          ln -fs /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

          apt-get update

          apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            device-tree-compiler \
            swig \
            python3 \
            python3-dev \
            python3-pip \
            git \
            ca-certificates \
            file \
            rsync \
            openssl \
            dosfstools \
            genext2fs

          pip3 install pyelftools

          python3 --version


      # ============================================================
      # AArch64 交叉编译器
      # ============================================================

      - name: Install AArch64 toolchain
        run: |
          echo "=========================================="
          echo "Install AArch64 Toolchain"
          echo "=========================================="

          apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          echo
          aarch64-linux-gnu-gcc --version

          echo
          which aarch64-linux-gnu-gcc


      # ============================================================
      # Checkout 当前 GitHub 仓库
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 下载 Rockchip Kernel
      # ============================================================

      - name: Clone official kernel source
        run: |
          echo "=========================================="
          echo "Clone Rockchip Kernel"
          echo "=========================================="

          git clone \
            --depth 1 \
            https://github.com/rockchip-linux/kernel.git

          ls -lh

          echo
          du -sh kernel


      # ============================================================
      # 查看 Kernel
      # ============================================================

      - name: Show Kernel source
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Kernel Version"
          echo "=========================================="

          head -n 10 Makefile

          echo
          echo "RK3326 DTS:"
          find arch/arm64/boot/dts/rockchip \
            -name "rk3326*.dts" \
            | head -30


      # ============================================================
      # 清理 Kernel
      # ============================================================

      - name: Clean Kernel
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Clean Kernel"
          echo "=========================================="

          make mrproper


      # ============================================================
      # 复制自定义 DTS / defconfig
      # ============================================================

      - name: Apply custom DTS and defconfig
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Apply custom files"
          echo "=========================================="

          cp ../kernel_custom/rk3326_linux.dts \
            arch/arm64/boot/dts/rockchip/rk3326_linux.dts

          cp ../kernel_custom/rk3326_linux_defconfig \
            arch/arm64/configs/rk3326_linux_defconfig

          echo
          echo "Custom DTS:"
          ls -lh \
            arch/arm64/boot/dts/rockchip/rk3326_linux.dts

          echo
          echo "Custom defconfig:"
          ls -lh \
            arch/arm64/configs/rk3326_linux_defconfig


      # ============================================================
      # 编译 DTS
      # ============================================================

      - name: Check DTS
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Check RK3326 DTS"
          echo "=========================================="

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/rockchip/rk3326_linux.dtb


      # ============================================================
      # Kernel 配置
      # ============================================================

      - name: Configure Kernel
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Configure RK3326 Kernel"
          echo "=========================================="

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            rk3326_linux_defconfig

          cp .config ../kernel.config

          echo
          echo "=========================================="
          echo "MMC configuration"
          echo "=========================================="

          grep "CONFIG_MMC" .config || true

          echo
          grep "CONFIG_MMC_DW" .config || true

          echo
          grep "CONFIG_MMC_DW_ROCKCHIP" .config || true

          echo
          grep "CONFIG_EXT4" .config || true


      # ============================================================
      # 编译 Kernel Image
      # ============================================================

      - name: Build Kernel Image
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Build Kernel Image"
          echo "=========================================="

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            Image

          echo
          ls -lh arch/arm64/boot/Image


      # ============================================================
      # 编译 DTB
      # ============================================================

      - name: Build RK3326 DTB
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Build RK3326 DTB"
          echo "=========================================="

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/rockchip/rk3326_linux.dtb

          echo
          ls -lh \
            arch/arm64/boot/dts/rockchip/rk3326_linux.dtb


      # ============================================================
      # 编译 Kernel Modules
      # ============================================================

      - name: Build Kernel modules
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Build Kernel Modules"
          echo "=========================================="

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            modules


      # ============================================================
      # 制作 boot 目录
      # ============================================================

      - name: Prepare boot files
        run: |
          echo "=========================================="
          echo "Prepare boot directory"
          echo "=========================================="

          mkdir -p boot/extlinux

          cp \
            kernel/arch/arm64/boot/Image \
            boot/Image

          cp \
            kernel/arch/arm64/boot/dts/rockchip/rk3326_linux.dtb \
            boot/rk3326_linux.dtb

          cat > boot/extlinux/extlinux.conf << 'EOF'
          label rk3326-linux
              kernel /Image
              fdt /rk3326_linux.dtb
              append earlycon=uart8250,mmio32,0xff160000 console=ttyS4,1500000n8 root=/dev/mmcblk0p4 rootwait rw rootfstype=ext4
          EOF

          echo
          echo "=========================================="
          echo "Boot files"
          echo "=========================================="

          find boot -type f -exec ls -lh {} \;


      # ============================================================
      # 制作 FAT boot.img
      # ============================================================

      - name: Generate boot.img
        run: |
          echo "=========================================="
          echo "Generate FAT boot.img"
          echo "=========================================="

          dd \
            if=/dev/zero \
            of=boot.img \
            bs=1M \
            count=32

          mkfs.fat boot.img

          mkdir -p boot-mnt

          # GitHub container 可能没有 mount 权限
          # 因此使用 mtools 直接写 FAT 文件系统

          apt-get update
          apt-get install -y mtools

          mcopy \
            -i boot.img \
            -s boot/* \
            ::

          echo
          echo "boot.img:"
          ls -lh boot.img

          file boot.img

          echo
          echo "FAT contents:"
          mdir -i boot.img ::/


      # ============================================================
      # 安装 Kernel Modules
      # ============================================================

      - name: Prepare Kernel modules
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Install Kernel modules"
          echo "=========================================="

          mkdir -p ../modules-output

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=../modules-output \
            modules_install

          cd ../modules-output

          tar \
            -czf \
            ../kernel-modules.tar.gz \
            .

          cd ..

          ls -lh kernel-modules.tar.gz


      # ============================================================
      # 准备最终输出
      # ============================================================

      - name: Prepare build output
        if: always()
        run: |
          echo "=========================================="
          echo "Prepare Build Output"
          echo "=========================================="

          mkdir -p build-output/kernel
          mkdir -p build-output/dtb
          mkdir -p build-output/boot
          mkdir -p build-output/modules
          mkdir -p build-output/config

          cp \
            kernel/arch/arm64/boot/Image \
            build-output/kernel/ \
            2>/dev/null || true

          cp \
            kernel/arch/arm64/boot/dts/rockchip/rk3326_linux.dtb \
            build-output/dtb/ \
            2>/dev/null || true

          cp \
            boot.img \
            build-output/boot/ \
            2>/dev/null || true

          cp \
            boot/extlinux/extlinux.conf \
            build-output/boot/ \
            2>/dev/null || true

          cp \
            kernel-modules.tar.gz \
            build-output/modules/ \
            2>/dev/null || true

          cp \
            kernel.config \
            build-output/config/rk3326.config \
            2>/dev/null || true

          cp \
            kernel/.config \
            build-output/config/kernel.config \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "Build output"
          echo "=========================================="

          find build-output \
            -type f \
            -exec ls -lh {} \;


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256
        if: always()
        run: |
          cd build-output

          find . \
            -type f \
            ! -name SHA256SUMS \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

          echo
          cat SHA256SUMS


      # ============================================================
      # 上传 Artifact
      # ============================================================

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3326-kernel-${{ github.sha }}
          path: build-output/
          if-no-files-found: warn
          retention-days: 30