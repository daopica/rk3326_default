name: RK3326 Kernel Build

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            device-tree-compiler \
            dosfstools \
            mtools \
            python3 \
            python3-pip \
            git \
            ca-certificates \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

          pip3 install pyelftools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Kernel
        run: |
          git clone --depth=1 \
            https://github.com/rockchip-linux/kernel.git

      - name: Apply custom files
        run: |
          cp kernel_custom/rk3326_linux.dts \
            kernel/arch/arm64/boot/dts/rockchip/rk3326_linux.dts

          cp kernel_custom/rk3326_linux_defconfig \
            kernel/arch/arm64/configs/rk3326_linux_defconfig

      - name: Configure Kernel
        working-directory: kernel
        run: |
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            rk3326_linux_defconfig

      - name: Build Kernel
        working-directory: kernel
        run: |
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) \
            Image

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/rockchip/rk3326_linux.dtb

      - name: Build boot.img
        run: |
          mkdir -p boot/extlinux

          cp kernel/arch/arm64/boot/Image \
            boot/Image

          cp kernel/arch/arm64/boot/dts/rockchip/rk3326_linux.dtb \
            boot/rk3326_linux.dtb

          cat > boot/extlinux/extlinux.conf << 'EOF'
          label rk3326-linux
              kernel /Image
              fdt /rk3326_linux.dtb
              append earlycon=uart8250,mmio32,0xff160000 console=ttyS4,1500000n8 root=/dev/mmcblk0p4 rootwait rw rootfstype=ext4
          EOF

          dd if=/dev/zero \
            of=boot.img \
            bs=1M \
            count=32

          mkfs.fat -F 32 boot.img

          mmd -i boot.img ::/extlinux

          mcopy -i boot.img \
            boot/Image \
            boot/rk3326_linux.dtb \
            ::/

          mcopy -i boot.img \
            boot/extlinux/extlinux.conf \
            ::/extlinux/

          ls -lh boot.img

      - name: Prepare output
        run: |
          mkdir -p output

          cp kernel/arch/arm64/boot/Image \
            output/

          cp kernel/arch/arm64/boot/dts/rockchip/rk3326_linux.dtb \
            output/

          cp boot.img \
            output/

          cp boot/extlinux/extlinux.conf \
            output/

          cp kernel/.config \
            output/kernel.config

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rk3326-kernel-${{ github.sha }}
          path: output/
          retention-days: 30